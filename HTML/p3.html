<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <div>
        <form action="\server">
            <caption><b>Registration form</b></caption>
            <br>
            <label for="username">Name:</label>
            <input type="text" id="username" name="username">
            <br>
            <label for="sex">Sex:</label>
            <input type="radio" id="sex" name="sex" value="male">
            <label for="sex">Male</label>
            <input type="radio" id="sex" name="sex" value="female">
            <label for="sex">Female</label>
            <br>
            <label for="Country">Country</label>
            <select id="country" name="country">
                <option value="usa">India</option>
                <option value="canada">Canada</option>
                <option value="uk">UK</option>
            </select>
            <br>
            <label for="feedback">Message:</label>
            <textarea id="feedback" name="feedback" placeholder="please enter your feedback here"></textarea>
            <br>
            <input type="checkbox" id="checkbox" name="checkbox">
            <label for="checkbox">Subscribe?</label>
            <br>
            <button type="submit">Submit</button>
        </form>
    </div>

</body>

</html>
